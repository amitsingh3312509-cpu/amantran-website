<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library Registration Form</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(-45deg,#2193b0,#6dd5ed,#4facfe,#00f2fe);
background-size:400% 400%;
animation:bg 10s ease infinite;
padding:20px;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.container{
max-width:650px;
margin:auto;
background:#fff;
padding:25px;
border-radius:15px;
box-shadow:0 0 20px rgba(0,0,0,.2);
}

.marquee{
background:#0d47a1;
color:#fff;
padding:10px;
border-radius:8px;
font-weight:bold;
margin-bottom:15px;
}

.creator{
text-align:center;
color:#0d47a1;
margin-bottom:15px;
font-weight:bold;
}

.step{
display:none;
}

.step.active{
display:block;
}

label{
display:block;
margin-top:12px;
font-weight:bold;
}

input,textarea,select{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ccc;
border-radius:8px;
}

.photo-preview{
width:130px;
height:130px;
margin:15px auto;
border:2px dashed #777;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
border-radius:10px;
}

.photo-preview img{
width:100%;
height:100%;
object-fit:cover;
}

button{
margin-top:20px;
width:100%;
padding:12px;
background:#0d47a1;
color:#fff;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#063970;
}

footer{
margin-top:20px;
text-align:center;
font-weight:bold;
color:white;
}
</style>
</head>

<body>

<div class="container">

<div class="marquee">
<marquee>
📚 Welcome To My Library Registration Form | Created By Er. Amit Kumar Singh 📚
</marquee>
</div>

<h2 style="text-align:center;color:#0d47a1;">
Library Registration Form
</h2>

<p class="creator">
Created by <b>Er. Amit Kumar Singh</b>
</p>

<form action="https://formsubmit.co/amitsingh3312509@gmail.com"
method="POST"
enctype="multipart/form-data">

<div class="step active" id="step1">

<label>Student Name</label>
<input type="text" name="Student Name" required>

<label>Email</label>
<input type="email" name="Email" required>

<label>Mobile Number</label>
<input type="tel" name="Mobile" pattern="[0-9]{10}" required>

<label>Father Name</label>
<input type="text" name="Father Name" required>

<label>Mother Name</label>
<input type="text" name="Mother Name" required>

<label>Address</label>
<textarea name="Address" rows="3"></textarea>

<label>Student Photo</label>

<div class="photo-preview" id="preview">
Photo Preview
</div>

<input type="file" id="photo" accept="image/*" required>

<button type="button" onclick="nextStep()">
Next →
</button>

</div>

<div class="step" id="step2">

<label>Qualification</label>

<select name="Qualification">

<option>High School</option>

<option>Intermediate</option>

<option>Diploma</option>

<option>B.Tech</option>

<option>B.Sc</option>

<option>M.Tech</option>

<option>Other</option>

</select>

<label>School / College Name</label>

<input type="text" name="College">

<label>Course</label>

<input type="text" name="Course">

<label>Year / Semester</label>

<input type="text" name="Year">

<label>Roll Number</label>

<input type="text" name="Roll Number">

<label>Percentage / CGPA</label>

<input type="text" name="Percentage">

<input type="hidden" name="_subject"
value="New Library Registration">

<input type="hidden"
name="_template"
value="table">

<input type="hidden"
name="_captcha"
value="false">

<button type="submit">
Submit Registration
</button>

</div>

</form>

</div>

<footer>
Created by <b>Er. Amit Kumar Singh</b> © 2026
</footer>

<script>
function nextStep(){
document.getElementById("step1").classList.remove("active");
document.getElementById("step2").classList.add("active");
}

const photo=document.getElementById("photo");
const preview=document.getElementById("preview");

photo.onchange=function(){
const file=this.files[0];
if(file){
const reader=new FileReader();
reader.onload=function(){
preview.innerHTML="<img src='"+reader.result+"'>";
}
reader.readAsDataURL(file);
}
}
</script>

</body>
</html>
