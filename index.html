<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Library Registration</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(-45deg,#2193b0,#6dd5ed,#4facfe,#00f2fe);
background-size:400% 400%;
animation:bg 8s infinite;
min-height:100vh;
padding:20px;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.container{
max-width:650px;
margin:auto;
background:#fff;
padding:30px;
border-radius:15px;
box-shadow:0 0 20px rgba(0,0,0,.3);
}

.page{
display:none;
}

.page.active{
display:block;
}

h1{
text-align:center;
color:#1565C0;
margin-bottom:15px;
}

marquee{
background:#1565C0;
color:#fff;
padding:10px;
border-radius:8px;
margin-bottom:20px;
font-weight:bold;
}

input,textarea{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:12px;
background:#1565C0;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#0D47A1;
}

.footer{
text-align:center;
margin-top:20px;
color:#1565C0;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<marquee>
📚 Engineer Amit Kumar Singh | All Student Registration Fees Free | According to Er. Amit Kumar Singh
</marquee>

<div id="loginPage" class="page active">

<h1>Library Login</h1>

<input type="text" id="username" placeholder="Enter Username">

<input type="password" id="password" placeholder="Enter Password">

<button onclick="login()">LOGIN</button>

<div class="footer">
Created by Er. Amit Kumar Singh
</div>

</div>

<div id="formPage" class="page">

<h1>Student Registration</h1>

<input type="text" placeholder="Student Name" required>

<input type="email" placeholder="Student Email" required>

<input type="tel" placeholder="Mobile Number" required>

<input type="tel" placeholder="Alternate Mobile Number">

<input type="text" placeholder="Father Name" required>

<input type="text" placeholder="Mother Name" required>

<textarea placeholder="Full Address"></textarea>

<button type="button" onclick="nextPage()">Next ➜</button>

</div>
<div id="educationPage" class="page">

<h1>Education Details</h1>

<form action="https://formsubmit.co/amitsingh3312509@gmail.com"
method="POST"
enctype="multipart/form-data">

<input type="text" name="Qualification" placeholder="Qualification" required>

<input type="text" name="School College" placeholder="School / College Name" required>

<input type="text" name="Course" placeholder="Course Name" required>

<input type="text" name="Year Semester" placeholder="Year / Semester" required>

<input type="text" name="Roll Number" placeholder="Roll Number">

<input type="text" name="Percentage" placeholder="Percentage / CGPA">

<label><b>Student Photo</b></label>

<div id="preview"
style="width:130px;height:130px;border:2px dashed #999;border-radius:10px;display:flex;align-items:center;justify-content:center;margin:15px auto;">
Photo Preview
</div>

<input type="file"
id="photo"
name="Student Photo"
accept="image/*"
required>

<input type="hidden" name="_subject" value="New Library Registration">
<input type="hidden" name="_template" value="table">
<input type="hidden" name="_captcha" value="false">

<button type="button" onclick="backPage()">⬅ Back</button>

<button type="submit">Submit Registration</button>

</form>

</div>

<script>

function nextPage(){
document.getElementById("formPage").classList.remove("active");
document.getElementById("educationPage").classList.add("active");
}

function backPage(){
document.getElementById("educationPage").classList.remove("active");
document.getElementById("formPage").classList.add("active");
}

const photo=document.getElementById("photo");
const preview=document.getElementById("preview");

photo.addEventListener("change",function(){

const file=this.files[0];

if(file){

const reader=new FileReader();

reader.onload=function(){

preview.innerHTML="<img src='"+reader.result+"' style='width:100%;height:100%;object-fit:cover;'>";

}

reader.readAsDataURL(file);

}

});

</script>
<script>
function login(){

let u=document.getElementById("username").value.trim();
let p=document.getElementById("password").value.trim();

if(u!=="" && p!==""){
document.getElementById("loginPage").classList.remove("active");
document.getElementById("formPage").classList.add("active");
}else{
alert("Please enter Username and Password");
}

}
</script>
<div id="successPage" class="page">

<h1>🎉 Registration Successful</h1>

<h2 id="regNo"></h2>

<h2 id="seatNo"></h2>

<h3 id="seatLeft"></h3>

<button onclick="location.reload()">New Registration</button>

</div>

<script>

const TOTAL_SEATS=200;
let currentSeat=Number(localStorage.getItem("librarySeat"))||1;

document.querySelector("form").addEventListener("submit",function(e){

e.preventDefault();

if(currentSeat>TOTAL_SEATS){
alert("All 200 Seats are Full");
return;
}

let regNo="LIB2026"+String(currentSeat).padStart(4,"0");

document.getElementById("educationPage").classList.remove("active");
document.getElementById("successPage").classList.add("active");

document.getElementById("regNo").innerHTML="Registration No : "+regNo;
document.getElementById("seatNo").innerHTML="Seat No : "+currentSeat;
document.getElementById("seatLeft").innerHTML="Available Seats : "+(TOTAL_SEATS-currentSeat);

currentSeat++;
localStorage.setItem("librarySeat",currentSeat);

});

</script>

</body>
</html>
