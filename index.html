<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Apps</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(180deg,#0b3d4d,#1a7d89);
color:white;
}

.header{
padding:20px;
font-size:35px;
font-weight:bold;
}

.tabs{
display:flex;
gap:20px;
padding:0 20px;
font-size:25px;
font-weight:bold;
}

.active{
border-bottom:4px solid white;
padding-bottom:8px;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:25px;
padding:25px;
}

.app{
text-align:center;
cursor:pointer;
}

.icon{
width:70px;
height:70px;
background:white;
border-radius:20px;
margin:auto;
display:flex;
justify-content:center;
align-items:center;
font-size:35px;
}

.name{
margin-top:8px;
font-size:16px;
}

.search{
position:fixed;
bottom:20px;
left:15px;
right:15px;
background:white;
border-radius:40px;
padding:15px;
}

.search input{
width:100%;
border:none;
outline:none;
font-size:20px;
}
</style>

</head>

<body>

<div class="header">Apps</div>

<div class="tabs">
<div class="active">Apps</div>
<div style="opacity:.5">Newsfeed</div>
</div>

<div class="grid">

<div class="app" onclick="openApp('Camera')">
<div class="icon">📷</div>
<div class="name">Camera</div>
</div>

<div class="app" onclick="openApp('ChatGPT')">
<div class="icon">🤖</div>
<div class="name">ChatGPT</div>
</div>

<div class="app" onclick="openApp('Clock')">
<div class="icon">🕒</div>
<div class="name">Clock</div>
</div>

<div class="app" onclick="openApp('Contacts')">
<div class="icon">👤</div>
<div class="name">Contacts</div>
</div>

<div class="app" onclick="openApp('Facebook')">
<div class="icon">📘</div>
<div class="name">Facebook</div>
</div>

<div class="app" onclick="openApp('Instagram')">
<div class="icon">📸</div>
<div class="name">Instagram</div>
</div>

<div class="app" onclick="openApp('WhatsApp')">
<div class="icon">💬</div>
<div class="name">WhatsApp</div>
</div>

<div class="app" onclick="openApp('YouTube')">
<div class="icon">▶️</div>
<div class="name">YouTube</div>
</div>

<div class="app" onclick="openApp('Play Store')">
<div class="icon">🛒</div>
<div class="name">Play Store</div>
</div>

<div class="app" onclick="openApp('Phone')">
<div class="icon">📞</div>
<div class="name">Phone</div>
</div>

<div class="app" onclick="openApp('Gallery')">
<div class="icon">🖼️</div>
<div class="name">Gallery</div>
</div>

<div class="app" onclick="openApp('Settings')">
<div class="icon">⚙️</div>
<div class="name">Settings</div>
</div>

</div>

<div class="search">
<input placeholder="Search Apps">
</div>

<script>
function openApp(name){
alert(name+" Open");
}
</script>

</body>
</html>
