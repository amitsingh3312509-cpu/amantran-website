<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library Login</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(-45deg,#2193b0,#6dd5ed,#4facfe,#00f2fe);
background-size:400% 400%;
animation:bg 8s infinite;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.box{
width:100%;
max-width:450px;
background:#fff;
padding:25px;
border-radius:15px;
box-shadow:0 0 20px rgba(0,0,0,.3);
}

.page{
display:none;
}

.page.active{
display:block;
}

h2{
text-align:center;
color:#0d47a1;
margin-bottom:15px;
}

input,textarea{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
}

button{
width:100%;
padding:12px;
background:#0d47a1;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
margin-top:10px;
}

.creator{
text-align:center;
margin-top:15px;
font-weight:bold;
color:#0d47a1;
}
</style>

</head>
<body>

<div class="box">

<div id="page1" class="page active">

<h2>📚 Library Login</h2>

<input type="text" id="user" placeholder="Enter Username">

<input type="password" id="pass" placeholder="Enter Password">

<button onclick="login()">Login</button>

<p class="creator">
Created by Er. Amit Kumar Singh
</p>

</div>

<div id="page2" class="page">

<h2>Student Registration</h2>

<form>

<input type="text" placeholder="Student Name" required>

<input type="email" placeholder="Email" required>

<input type="tel" placeholder="Mobile Number" required>

<input type="text" placeholder="Father Name">

<input type="text" placeholder="Mother Name">

<textarea placeholder="Address"></textarea>

<button type="button" onclick="nextPage()">Next ➜</button>

</form>

</div>

</div>

<script>

function login(){

let username=document.getElementById("user").value.trim();

let password=document.getElementById("pass").value.trim();

if(username!=="" && password!==""){

document.getElementById("page1").classList.remove("active");

document.getElementById("page2").classList.add("active");

}else{

alert("Please enter Username and Password");

}

}

function nextPage(){

alert("Education Form अगले भाग में जोड़ेंगे.");

}

</script>
<!-- ================= PAGE 3 : EDUCATION DETAILS ================= -->

<div id="page3" class="page">

<h2>Education Details</h2>

<form action="https://formsubmit.co/amitsingh3312509@gmail.com"
method="POST"
enctype="multipart/form-data">

<input type="text"
name="Qualification"
placeholder="Qualification"
required>

<input type="text"
name="School/College"
placeholder="School / College Name"
required>

<input type="text"
name="Course"
placeholder="Course"
required>

<input type="text"
name="Year"
placeholder="Year / Semester"
required>

<input type="text"
name="Roll Number"
placeholder="Roll Number">

<input type="text"
name="Percentage"
placeholder="Percentage / CGPA">

<label><b>Student Photo</b></label>

<div id="preview"
style="width:120px;height:120px;border:2px dashed gray;border-radius:10px;display:flex;align-items:center;justify-content:center;margin:auto;">
Photo Preview
</div>

<input type="file"
id="photo"
name="Student Photo"
accept="image/*"
required>

<input type="hidden"
name="_subject"
value="New Library Registration">

<input type="hidden"
name="_template"
value="table">

<input type="hidden"
name="_captcha"
value="false">

<button type="button" onclick="backPage()">
⬅ Back
</button>

<button type="submit">
Submit Registration
</button>

</form>

</div>

<script>

function nextPage(){

document.getElementById("page2").classList.remove("active");

document.getElementById("page3").classList.add("active");

}

function backPage(){

document.getElementById("page3").classList.remove("active");

document.getElementById("page2").classList.add("active");

}

const photo=document.getElementById("photo");
const preview=document.getElementById("preview");

photo.onchange=function(){

const file=this.files[0];

if(file){

const reader=new FileReader();

reader.onload=function(){

preview.innerHTML="<img src='"+reader.result+"' style='width:100%;height:100%;object-fit:cover;'>";

}

reader.readAsDataURL(file);

}

}

</script>
</body>
</html>
