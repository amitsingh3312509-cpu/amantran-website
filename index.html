<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Online Application Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{
background:#eef5ff;
}


header{

background:linear-gradient(135deg,#003366,#0077ff);
color:white;
padding:25px;
text-align:center;

}


header h1{
font-size:32px;
}


header p{
font-size:18px;
margin-top:8px;
}


marquee{

background:#ff6600;
color:white;
padding:10px;
font-weight:bold;

}



.container{

width:95%;
max-width:900px;
margin:25px auto;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 0 20px #aaa;

}


h2{

text-align:center;
color:#003366;
margin-bottom:20px;

}


label{

font-weight:bold;
display:block;
margin-top:15px;

}


input,select,textarea{

width:100%;
padding:12px;
margin-top:7px;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;

}


textarea{

height:120px;

}



button{

width:100%;
padding:14px;
margin-top:20px;
background:#0077ff;
color:white;
border:none;
border-radius:10px;
font-size:18px;

}


button:hover{

background:#003399;

}



.btn-group{

display:flex;
gap:10px;
flex-wrap:wrap;

}


.btn-group button{

flex:1;

}



#output{

margin-top:25px;
background:white;
padding:30px;
min-height:400px;
border:1px solid #ddd;
border-radius:10px;
line-height:2;
font-size:17px;

}



footer{

background:#003366;
color:white;
text-align:center;
padding:15px;
margin-top:30px;

}


</style>

</head>


<body>


<header>

<h1>📝 Smart Online Application Generator</h1>

<p>Professional Hindi & English Application Maker</p>

</header>


<marquee>

25+ Reasons | Hindi | English | PDF | Print | Copy | Professional Application

</marquee>



<div class="container">


<h2>
Application Form / आवेदन फॉर्म
</h2>



<label>
Select Language / भाषा
</label>

<select id="language">

<option value="hindi">🇮🇳 हिन्दी</option>

<option value="english">🇬🇧 English</option>

<option value="both">🌐 Hindi + English</option>

</select>



<label>
Select Reason / आवेदन कारण
</label>


<select id="reason">

<option>Leave Application</option>
<option>Medical Leave</option>
<option>Sick Leave</option>
<option>Bank Account Opening</option>
<option>ATM Card Lost</option>
<option>New ATM Card Request</option>
<option>Passbook Issue</option>
<option>Cheque Book Request</option>
<option>Scholarship Application</option>
<option>Fee Waiver Application</option>
<option>TC Certificate</option>
<option>Character Certificate</option>
<option>Bonafide Certificate</option>
<option>Migration Certificate</option>
<option>Job Application</option>
<option>Resignation Letter</option>
<option>Complaint Application</option>
<option>Electricity Complaint</option>
<option>Water Supply Complaint</option>
<option>Road Repair Complaint</option>
<option>Name Correction</option>
<option>Address Change</option>
<option>Birth Certificate</option>
<option>Police Verification</option>
<option>Gas Connection</option>
<option>Internet Complaint</option>
<option>Pension Application</option>
<option>Other Reason</option>

</select>



<label>
Receiver Name / प्राप्तकर्ता
</label>

<input id="receiver" placeholder="Principal / Manager / Officer">


<label>
Department / Office
</label>

<input id="department" placeholder="Office Name">


<label>
Applicant Name / आवेदक का नाम
</label>

<input id="name" placeholder="Your Name">


<label>
Father / Mother Name
</label>

<input id="father" placeholder="Father or Mother Name">


<label>
Mobile Number
</label>

<input id="mobile" placeholder="Mobile Number">


<label>
Email Address
</label>

<input id="email" placeholder="Email Address">


<label>
Full Address / पूरा पता
</label>

<textarea id="address" placeholder="Full Address"></textarea>



<label>
Reason Details / आवेदन विवरण
</label>

<textarea id="details" placeholder="Write Complete Details"></textarea>



<label>
Place / स्थान
</label>

<input id="place" placeholder="Place">



<label>
Date / दिनांक
</label>

<input type="date" id="date">



<button onclick="generateApplication()">

📝 Generate Application

</button>



<div class="btn-group">

<button onclick="copyApplication()">
📋 Copy
</button>

<button onclick="printApplication()">
🖨 Print
</button>

<button onclick="downloadPDF()">
📄 Download PDF
</button>

</div>



<div id="output">

Your Real Application Preview Will Appear Here...

</div>


</div>


<footer>

Created by Amit Kumar Singh

</footer>

<script>

function generateApplication(){

let language=document.getElementById("language").value;

let reason=document.getElementById("reason").value;

let receiver=document.getElementById("receiver").value;

let department=document.getElementById("department").value;

let name=document.getElementById("name").value;

let father=document.getElementById("father").value;

let mobile=document.getElementById("mobile").value;

let email=document.getElementById("email").value;

let address=document.getElementById("address").value;

let details=document.getElementById("details").value;

let place=document.getElementById("place").value;

let date=document.getElementById("date").value;



let hindi = `सेवा में,
${receiver}
${department}

विषय: ${reason} के संबंध में आवेदन पत्र।

महोदय,

सविनय निवेदन है कि मैं ${name}, पिता/माता ${father}, निवासी ${address} हूँ।

मैं आपके सम्मानित कार्यालय में ${reason} के संबंध में यह आवेदन प्रस्तुत कर रहा हूँ।

मेरी वर्तमान समस्या एवं आवेदन का विवरण इस प्रकार है:

${details}

मैं आपसे निवेदन करना चाहता हूँ कि मेरी समस्या को ध्यान में रखते हुए मेरे आवेदन पर सहानुभूतिपूर्वक विचार किया जाए।

आपके द्वारा की गई सहायता मेरे लिए बहुत महत्वपूर्ण होगी।

अतः आपसे पुनः अनुरोध है कि मेरे आवेदन को स्वीकार करते हुए आवश्यक कार्यवाही करने की कृपा करें।

मैं आशा करता हूँ कि आप मेरी समस्या का समाधान शीघ्र करने का प्रयास करेंगे।

इसके लिए मैं आपका सदैव आभारी एवं कृतज्ञ रहूंगा।

धन्यवाद।

भवदीय,

आवेदक का नाम: ${name}

पिता/माता का नाम: ${father}

पता: ${address}

मोबाइल नंबर: ${mobile}

ईमेल: ${email}

स्थान: ${place}

दिनांक: ${date}`;



let english = `To,
${receiver}
${department}

Subject: Application regarding ${reason}.

Respected Sir/Madam,

With due respect, I would like to state that I am ${name}, son/daughter of ${father}, and resident of ${address}.

I am submitting this application to your respected office regarding ${reason}.

The complete details of my request are mentioned below:

${details}

I kindly request you to consider my situation and look into my application carefully.

Your support and positive response will be very helpful for me.

Therefore, I request you to take necessary action on my application at the earliest.

I hope you will understand my problem and provide a suitable solution.

I shall always remain grateful to you for your valuable support.

Thank You.

Yours faithfully,

Applicant Name: ${name}

Father/Mother Name: ${father}

Address: ${address}

Mobile Number: ${mobile}

Email: ${email}

Place: ${place}

Date: ${date}`;

let result="";


if(language=="hindi"){

result=hindi;

}

else if(language=="english"){

result=english;

}

else{

result=hindi+

"\n\n--------------------------------\n\n"+

english;

}



document.getElementById("output").innerText=result;


}



function copyApplication(){

let text=document.getElementById("output").innerText;

navigator.clipboard.writeText(text);

alert("Application Copied Successfully");

}



function printApplication(){

let printData=document.getElementById("output").innerHTML;

let newWindow=window.open("");

newWindow.document.write(

"<h2>Application</h2>"+printData

);

newWindow.print();

}



function clearForm(){

document.querySelectorAll("input,textarea").forEach(function(item){

item.value="";

});


document.getElementById("output").innerText=

"Your Real Application Preview Will Appear Here...";

}



</script>
</body>

</html>
